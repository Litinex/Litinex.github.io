<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AdaBoost 逐轮关注错分样本并加权投票</title>
  <desc id="desc">第一轮所有样本权重相同，树桩一分错一个样本；第二轮提高错分样本权重；第三轮继续纠错；最终三棵树桩按可靠程度加权投票，组合训练错误率降为零。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2f"/><stop offset="1" stop-color="#172840"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".25"/></filter>
    <style>.card{fill:#203754;stroke:#67b7f6;stroke-width:3}.final{fill:#153f38;stroke:#68dfb3;stroke-width:3}.line{fill:none;stroke:#8ca7c5;stroke-width:5;stroke-linecap:round}.arrow{fill:#8ca7c5}.title{fill:#f5f8ff;font:800 30px system-ui,sans-serif;text-anchor:middle}.h{fill:#fff;font:800 24px system-ui,sans-serif;text-anchor:middle}.p{fill:#c5d3e5;font:500 18px system-ui,sans-serif;text-anchor:middle}.metric{fill:#ffd36e;font:800 20px system-ui,sans-serif;text-anchor:middle}.dot-ok{fill:#67b7ff;stroke:#d9efff;stroke-width:2}.dot-bad{fill:#ff789f;stroke:#ffe0e9;stroke-width:3}.vote{fill:#aa98ff;font:800 20px system-ui,sans-serif;text-anchor:middle}.strong{fill:#75e1b9;font:800 24px system-ui,sans-serif;text-anchor:middle}</style>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text class="title" x="600" y="56">AdaBoost：不是要求一棵树不犯错，而是让下一棵树专门补前面的错</text>
  <path class="line" d="M330 255H435M765 255H870M600 420V515"/><path class="arrow" d="M435 255l-18-11v22zM870 255l-18-11v22zM600 515l-11-18h22z"/>
  <g filter="url(#shadow)"><rect class="card" x="35" y="100" width="295" height="315" rx="25"/><text class="h" x="182" y="145">第 1 轮：同样重要</text><text class="p" x="182" y="178">每个样本权重都是 1/5</text>
    <circle class="dot-ok" cx="95" cy="235" r="17"/><circle class="dot-ok" cx="153" cy="235" r="17"/><circle class="dot-bad" cx="211" cy="235" r="17"/><circle class="dot-ok" cx="269" cy="235" r="17"/>
    <text class="p" x="182" y="287">树桩 1 分错一个样本</text><text class="metric" x="182" y="326">错误率 0.2000</text><text class="vote" x="182" y="365">alpha = 0.6931</text><text class="p" x="182" y="395">圈出错题，交给下一轮</text></g>
  <g filter="url(#shadow)"><rect class="card" x="435" y="100" width="330" height="315" rx="25"/><text class="h" x="600" y="145">第 2 轮：放大错题</text><text class="p" x="600" y="178">错分样本的权重变大</text>
    <circle class="dot-ok" cx="500" cy="235" r="13"/><circle class="dot-ok" cx="558" cy="235" r="13"/><circle class="dot-bad" cx="625" cy="235" r="27"/><circle class="dot-ok" cx="700" cy="235" r="13"/>
    <text class="p" x="600" y="287">按新权重寻找树桩 2</text><text class="metric" x="600" y="326">错误率 0.1250</text><text class="vote" x="600" y="365">alpha = 0.9730</text><text class="p" x="600" y="395">更可靠，最终投票权更大</text></g>
  <g filter="url(#shadow)"><rect class="card" x="870" y="100" width="295" height="315" rx="25"/><text class="h" x="1017" y="145">第 3 轮：继续纠错</text><text class="p" x="1017" y="178">关注前两轮仍难分的样本</text>
    <circle class="dot-bad" cx="930" cy="235" r="22"/><circle class="dot-ok" cx="988" cy="235" r="13"/><circle class="dot-ok" cx="1046" cy="235" r="13"/><circle class="dot-bad" cx="1104" cy="235" r="18"/>
    <text class="p" x="1017" y="287">第三棵树桩补足盲区</text><text class="metric" x="1017" y="326">错误率 0.1429</text><text class="vote" x="1017" y="365">alpha = 0.8959</text><text class="p" x="1017" y="395">三位投票者各有所长</text></g>
  <g filter="url(#shadow)"><rect class="final" x="270" y="515" width="660" height="150" rx="28"/><text class="h" x="600" y="558">最终：按 alpha 加权投票</text><text class="p" x="600" y="595">sign(alpha₁ × 树桩₁ + alpha₂ × 树桩₂ + alpha₃ × 树桩₃)</text><text class="strong" x="600" y="636">3 棵弱分类器组合后，5 个训练样本全部分对</text></g>
  <text class="p" x="600" y="700">蓝色表示本轮容易样本，粉色与圆点大小表示被重点关注的错分样本</text>
</svg>
