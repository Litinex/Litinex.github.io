<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Logistic 回归分类流程和决策边界</title>
  <desc id="desc">特征经过加权求和得到分数，再经过 Sigmoid 得到类别一概率，以零点五为阈值分类。二维空间中的零点五位置形成一条直线决策边界。</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2f"/><stop offset="1" stop-color="#172840"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".25"/></filter><style>.title{fill:#f4f8ff;font:800 30px system-ui,sans-serif;text-anchor:middle}.box{fill:#203754;stroke:#68b7f6;stroke-width:3}.prob{fill:#2b3152;stroke:#9c8dff;stroke-width:3}.h{fill:#fff;font:800 23px system-ui,sans-serif;text-anchor:middle}.p{fill:#c6d4e5;font:500 18px system-ui,sans-serif;text-anchor:middle}.line{stroke:#89a5c5;stroke-width:5;stroke-linecap:round}.arrow{fill:#89a5c5}.plot{fill:#17263b;stroke:#3c5674;stroke-width:2}.axis{stroke:#829ab7;stroke-width:3}.boundary{stroke:#ffd36e;stroke-width:7;stroke-linecap:round}.dot0{fill:#67b7ff;stroke:#d5edff;stroke-width:2}.dot1{fill:#ff789f;stroke:#ffe1e9;stroke-width:2}.region0{fill:#4ea8f0;opacity:.12}.region1{fill:#ff6e98;opacity:.12}.label{fill:#f4f8ff;font:700 18px system-ui,sans-serif;text-anchor:middle}.small{fill:#b9c9de;font:500 17px system-ui,sans-serif;text-anchor:middle}</style></defs>
  <rect width="1200" height="700" rx="32" fill="url(#bg2)"/><text class="title" x="600" y="53">Logistic 回归：先线性打分，再把分数变成概率</text>
  <g filter="url(#s)"><rect class="box" x="50" y="100" width="245" height="120" rx="23"/><text class="h" x="172" y="145">输入特征 x</text><text class="p" x="172" y="180">年龄、收入、症状……</text></g>
  <g filter="url(#s)"><rect class="box" x="370" y="100" width="275" height="120" rx="23"/><text class="h" x="507" y="145">线性分数 z</text><text class="p" x="507" y="180">w₀ + w₁x₁ + w₂x₂ + …</text></g>
  <g filter="url(#s)"><rect class="prob" x="720" y="100" width="245" height="120" rx="23"/><text class="h" x="842" y="145">Sigmoid 概率</text><text class="p" x="842" y="180">p = 1 / (1 + e⁻ᶻ)</text></g>
  <path class="line" d="M295 160H370M645 160H720M965 160H1125"/><path class="arrow" d="M370 160l-18-11v22zM720 160l-18-11v22zM1125 160l-18-11v22z"/><text class="small" x="1085" y="130">p &gt; 0.5 → 类别 1</text><text class="small" x="1085" y="200">否则 → 类别 0</text>
  <rect class="plot" x="120" y="285" width="960" height="345" rx="25"/><path class="region0" d="M120 285H281L958 630H120z"/><path class="region1" d="M281 285H1080V630H958z"/><line class="axis" x1="185" y1="575" x2="1025" y2="575"/><line class="axis" x1="185" y1="575" x2="185" y2="330"/><line class="boundary" x1="350" y1="320" x2="850" y2="575"/>
  <g class="dot0"><circle cx="280" cy="520" r="13"/><circle cx="345" cy="475" r="13"/><circle cx="420" cy="515" r="13"/><circle cx="490" cy="440" r="13"/><circle cx="560" cy="500" r="13"/><circle cx="625" cy="500" r="13"/><circle cx="700" cy="530" r="13"/></g>
  <g class="dot1"><circle cx="510" cy="350" r="13"/><circle cx="600" cy="340" r="13"/><circle cx="680" cy="370" r="13"/><circle cx="735" cy="315" r="13"/><circle cx="790" cy="390" r="13"/><circle cx="870" cy="360" r="13"/><circle cx="920" cy="430" r="13"/></g>
  <text class="label" x="315" y="560">预测为类别 0</text><text class="label" x="920" y="350">预测为类别 1</text><text class="label" x="740" y="605">p = 0.5，也就是 z = 0</text><text class="small" x="600" y="675">二维时边界是一条直线；更多特征时，它是更高维空间中的一个超平面</text>
</svg>
