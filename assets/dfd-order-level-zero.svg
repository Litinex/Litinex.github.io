<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 745" role="img" aria-labelledby="title desc"><title id="title">订单系统0层数据流图</title><desc id="desc">顾客提交订单请求，经校验后输出失败结果，或将有效订单交给登记订单加工，写入订单记录并返回成功结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36566b"/></marker></defs><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#193344;font-size:25px}.heading{font-size:30px;font-weight:700}.label{font-size:22px}.node{fill:#e3f0f2;stroke:#36566b;stroke-width:2.5}.entity{fill:#fff4df;stroke:#8b6b38;stroke-width:2.5}.flow{fill:none;stroke:#36566b;stroke-width:2.5;marker-end:url(#arrow)}.store{fill:none;stroke:#36566b;stroke-width:2.5}</style><rect width="100%" height="100%" rx="20" fill="#f6f8fa"/><text x="40" y="55" class="heading">0层图：展开内部加工，保留边界信息</text><rect class="entity" x="50" y="120" width="160" height="105"/><text x="130" y="180" text-anchor="middle">顾客</text><rect class="node" x="400" y="120" width="250" height="105" rx="30"/><text x="525" y="165" text-anchor="middle">1</text><text x="525" y="200" text-anchor="middle">校验订单</text><rect class="node" x="400" y="370" width="250" height="105" rx="30"/><text x="525" y="415" text-anchor="middle">2</text><text x="525" y="450" text-anchor="middle">登记订单</text><path class="flow" d="M210 150H400"/><text x="300" y="137" text-anchor="middle" class="label">订单请求</text><path class="flow" d="M400 200H210"/><text x="304" y="246" text-anchor="middle" class="label">订单结果（失败）</text><path class="flow" d="M525 225V370"/><text x="548" y="310" class="label">有效订单</text><path class="flow" d="M400 425H130V225"/><text x="245" y="462" text-anchor="middle" class="label">订单结果（成功）</text><path class="flow" d="M525 475V585"/><text x="548" y="547" class="label">新订单记录</text><path class="store" d="M380 585H690M380 648H690"/><text x="535" y="625" text-anchor="middle">D1 订单记录</text><text x="40" y="704" class="label">两类订单结果共同对应顶层图的“订单结果”输出。</text></svg>