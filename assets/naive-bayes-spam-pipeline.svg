<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">朴素贝叶斯垃圾邮件过滤流程</title>
  <desc id="desc">一封邮件依次经过分词、词表向量化、分别计算垃圾邮件和正常邮件得分，最后输出分类结果。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2f"/><stop offset="1" stop-color="#172840"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".25"/></filter>
    <style>.box{fill:#203754;stroke:#69b7f6;stroke-width:3}.score{fill:#26334e;stroke:#9b8cff;stroke-width:3}.result{fill:#153f38;stroke:#62dfaf;stroke-width:3}.line{fill:none;stroke:#89a5c5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#89a5c5}.title{fill:#f3f7ff;font:800 30px system-ui,sans-serif;text-anchor:middle}.h{fill:#fff;font:800 25px system-ui,sans-serif;text-anchor:middle}.p{fill:#c5d2e4;font:500 18px system-ui,sans-serif;text-anchor:middle}.spam{fill:#ff93b0;font:800 21px system-ui,sans-serif;text-anchor:middle}.ham{fill:#73dfb8;font:800 21px system-ui,sans-serif;text-anchor:middle}</style>
  </defs>
  <rect width="1200" height="650" rx="32" fill="url(#bg)"/><text class="title" x="600" y="56">一封邮件怎样被朴素贝叶斯判为“垃圾”或“正常”</text>
  <path class="line" d="M250 215H335M545 215H630M840 215H920M735 280V345M735 475V535"/><path class="arrow" d="M335 215l-18-11v22zM630 215l-18-11v22zM920 215l-18-11v22zM735 345l-11-18h22zM735 535l-11-18h22z"/>
  <g filter="url(#shadow)"><rect class="box" x="45" y="145" width="205" height="140" rx="23"/><text class="h" x="147" y="193">原始邮件</text><text class="p" x="147" y="230">“save money”</text><text class="p" x="147" y="258">“meeting today”</text></g>
  <g filter="url(#shadow)"><rect class="box" x="335" y="145" width="210" height="140" rx="23"/><text class="h" x="440" y="193">分词与清洗</text><text class="p" x="440" y="230">统一小写</text><text class="p" x="440" y="258">过滤过短词语</text></g>
  <g filter="url(#shadow)"><rect class="box" x="630" y="145" width="210" height="140" rx="23"/><text class="h" x="735" y="193">词袋向量</text><text class="p" x="735" y="230">[0, 2, 0, 1, …]</text><text class="p" x="735" y="258">每个位置对应一个词</text></g>
  <g filter="url(#shadow)"><rect class="score" x="920" y="130" width="235" height="170" rx="23"/><text class="h" x="1037" y="180">读取训练结果</text><text class="spam" x="1037" y="222">垃圾词概率</text><text class="ham" x="1037" y="258">正常词概率</text><text class="p" x="1037" y="286">以及类别先验概率</text></g>
  <g filter="url(#shadow)"><rect class="score" x="540" y="345" width="390" height="130" rx="23"/><text class="h" x="735" y="390">分别累加两类的对数得分</text><text class="p" x="735" y="428">log P(类别) + Σ 词频 × log P(词 | 类别)</text></g>
  <g filter="url(#shadow)"><rect class="result" x="585" y="535" width="300" height="80" rx="25"/><text class="h" x="735" y="584">分数更大的一类胜出</text></g>
</svg>
