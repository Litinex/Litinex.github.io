<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">单词为垃圾邮件和正常邮件提供证据</title>
  <desc id="desc">先验概率像天平初始位置，免费购买折扣等词把结果推向垃圾邮件，会议项目明天等词把结果推向正常邮件。</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b2f"/><stop offset="1" stop-color="#172840"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".25"/></filter><style>.title{fill:#f4f8ff;font:800 30px system-ui,sans-serif;text-anchor:middle}.sub{fill:#b9c9de;font:500 19px system-ui,sans-serif;text-anchor:middle}.beam{stroke:#d4deec;stroke-width:12;stroke-linecap:round}.stand{fill:#627b9a}.spam-box{fill:#4a2935;stroke:#ff87a8;stroke-width:3}.ham-box{fill:#153f38;stroke:#62dfaf;stroke-width:3}.word-s{fill:#6a3042;stroke:#ff98b4;stroke-width:2}.word-h{fill:#1c5348;stroke:#79e4bd;stroke-width:2}.w{fill:#fff;font:700 22px system-ui,sans-serif;text-anchor:middle}.h{fill:#fff;font:800 28px system-ui,sans-serif;text-anchor:middle}.small{fill:#cbd7e7;font:500 18px system-ui,sans-serif;text-anchor:middle}</style></defs>
  <rect width="1200" height="650" rx="32" fill="url(#bg2)"/><text class="title" x="600" y="58">贝叶斯分类的直觉：每个词都在为某一类“增加证据”</text><text class="sub" x="600" y="92">先验概率是起点，邮件中的词会不断改变两边的相对得分</text>
  <line class="beam" x1="270" y1="365" x2="930" y2="315"/><path class="stand" d="M600 325l-85 190h170z"/><rect class="stand" x="440" y="505" width="320" height="28" rx="14"/>
  <line class="beam" x1="330" y1="340" x2="330" y2="430"/><line class="beam" x1="870" y1="320" x2="870" y2="410"/>
  <g filter="url(#s)"><rect class="spam-box" x="165" y="425" width="330" height="120" rx="25"/><text class="h" x="330" y="475">垃圾邮件得分</text><text class="small" x="330" y="512">P(垃圾) × 各词条件概率</text></g>
  <g filter="url(#s)"><rect class="ham-box" x="705" y="405" width="330" height="120" rx="25"/><text class="h" x="870" y="455">正常邮件得分</text><text class="small" x="870" y="492">P(正常) × 各词条件概率</text></g>
  <g filter="url(#s)"><rect class="word-s" x="105" y="155" width="165" height="58" rx="20"/><text class="w" x="187" y="192">discount</text><rect class="word-s" x="285" y="235" width="145" height="58" rx="20"/><text class="w" x="357" y="272">buy</text><rect class="word-s" x="445" y="140" width="155" height="58" rx="20"/><text class="w" x="522" y="177">free</text></g>
  <g filter="url(#s)"><rect class="word-h" x="620" y="150" width="165" height="58" rx="20"/><text class="w" x="702" y="187">meeting</text><rect class="word-h" x="800" y="220" width="150" height="58" rx="20"/><text class="w" x="875" y="257">project</text><rect class="word-h" x="965" y="135" width="145" height="58" rx="20"/><text class="w" x="1037" y="172">tomorrow</text></g>
  <text class="small" x="600" y="602">“朴素”假设让模型可以分别统计每个词；最终比较的是整封邮件的综合证据</text>
</svg>
