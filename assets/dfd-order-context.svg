<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 365" role="img" aria-labelledby="title desc"><title id="title">订单系统顶层数据流图</title><desc id="desc">顾客发送订单请求到订单处理系统，系统返回订单结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#36566b"/></marker></defs><style>text{font-family:system-ui,'Microsoft YaHei',sans-serif;fill:#193344;font-size:25px}.heading{font-size:30px;font-weight:700}.label{font-size:22px}.node{fill:#e3f0f2;stroke:#36566b;stroke-width:2.5}.entity{fill:#fff4df;stroke:#8b6b38;stroke-width:2.5}.flow{fill:none;stroke:#36566b;stroke-width:2.5;marker-end:url(#arrow)}.store{fill:none;stroke:#36566b;stroke-width:2.5}</style><rect width="100%" height="100%" rx="20" fill="#f6f8fa"/><text x="40" y="55" class="heading">顶层图：先确认系统边界</text><rect class="entity" x="50" y="140" width="160" height="100"/><text x="130" y="199" text-anchor="middle">顾客</text><ellipse class="node" cx="655" cy="190" rx="165" ry="77"/><text x="655" y="199" text-anchor="middle">订单处理系统</text><path class="flow" d="M210 163H490"/><text x="350" y="147" text-anchor="middle" class="label">订单请求</text><path class="flow" d="M490 220H210"/><text x="350" y="254" text-anchor="middle" class="label">订单结果</text><text x="40" y="322" class="label">箭头表示数据流向；内部加工与存储留待下一层展开。</text></svg>