  <g transform="translate(806 537)">
    <rect width="274" height="65" rx="7" fill="#17202a"/>
    <text x="137" y="41" text-anchor="middle" fill="#ffffff" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="22" font-weight="700">3 : 2 → 预测为蓝色</text>
